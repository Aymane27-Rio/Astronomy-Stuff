</head>
<body data-section="galaxy">
  <div class="site-wrap">
    <div class="stars"></div>
    <header class="header">
      <div class="brand">Cosmic Phenomena</div>
      <nav class="nav">
        <a class="atlas-link" href="index.html">← Atlas</a>

        <a href="physics.html">Physics &amp; Maths</a>
        <a href="skywatching.html">Skywatching</a>
      </nav>
    </header>

    <button class="info-toggle" type="button" aria-controls="infoPanel" aria-expanded="false" aria-label="Open galaxy information" onclick="toggleInfoPanel()">INFO</button>
    <div class="info-panel" id="infoPanel" aria-hidden="true"><div class="info-content" id="infoContent"></div></div>

    <main class="main">
      <section class="scene">
        <div class="section-title">Spiral Galaxy</div>
        <div class="galaxy-container" role="img" aria-label="An animated spiral galaxy with a luminous core and four spiral arms">
          <svg class="galaxy-art" viewBox="0 0 800 800" aria-hidden="true" focusable="false">
            <defs>
              <radialGradient id="galaxy-disk">
                <stop offset="0" stop-color="#fff3b0" stop-opacity=".5" />
                <stop offset=".18" stop-color="#8dbdff" stop-opacity=".18" />
                <stop offset=".62" stop-color="#3167ad" stop-opacity=".08" />
                <stop offset="1" stop-color="#10203b" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="galaxy-core">
                <stop offset="0" stop-color="#fffef2" />
                <stop offset=".12" stop-color="#fff7cb" />
                <stop offset=".32" stop-color="#ffe28a" />
                <stop offset=".58" stop-color="#ffc35c" stop-opacity=".74" />
                <stop offset="1" stop-color="#ff9b42" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="galaxy-arm" x1="0" y1="0" x2="1" y2=".2">
                <stop offset="0" stop-color="#d6edff" stop-opacity=".05" />
                <stop offset=".28" stop-color="#73b9ff" stop-opacity=".68" />
                <stop offset=".6" stop-color="#c4e3ff" stop-opacity=".82" />
                <stop offset="1" stop-color="#6ba7ff" stop-opacity=".08" />
              </linearGradient>
              <filter id="galaxy-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="12" />
              </filter>
              <filter id="galaxy-star-glow" x="-300%" y="-300%" width="700%" height="700%">
                <feGaussianBlur stdDeviation="2.2" result="blur" />
                <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
              <path id="galaxy-spiral-path" d="M 418 398 C 454 384 469 352 447 334 C 422 314 383 328 370 360 C 352 404 384 446 430 450 C 485 455 524 411 513 358 C 501 301 439 268 380 285 C 311 306 280 381 307 447 C 340 528 441 558 522 515 C 620 463 638 342 570 260 C 500 175 365 160 270 225 C 181 287 153 395 192 492" />
              <g id="galaxy-star-clusters">
                <circle cx="447" cy="334" r="3.2" /><circle cx="370" cy="360" r="2.2" /><circle cx="430" cy="450" r="2.8" />
                <circle cx="513" cy="358" r="2.3" /><circle cx="380" cy="285" r="3.4" /><circle cx="307" cy="447" r="2.5" />
                <circle cx="522" cy="515" r="3" /><circle cx="570" cy="260" r="2.1" /><circle cx="270" cy="225" r="2.8" />
              </g>
            </defs>
            <ellipse class="galaxy-backglow" cx="400" cy="400" rx="340" ry="210" fill="url(#galaxy-disk)" />
            <ellipse class="galaxy-disc-edge" cx="400" cy="400" rx="315" ry="184" />
            <g class="galaxy-spiral-arms">
              <g class="spiral-arm arm-1">
                <use href="#galaxy-spiral-path" class="arm-halo" />
                <use href="#galaxy-spiral-path" class="arm-light" />
                <use href="#galaxy-spiral-path" class="arm-dust" />
                <use href="#galaxy-star-clusters" class="arm-stars" />
              </g>
              <g class="spiral-arm arm-2"><use href="#galaxy-spiral-path" class="arm-halo" /><use href="#galaxy-spiral-path" class="arm-light" /><use href="#galaxy-spiral-path" class="arm-dust" /><use href="#galaxy-star-clusters" class="arm-stars" /></g>
              <g class="spiral-arm arm-3"><use href="#galaxy-spiral-path" class="arm-halo" /><use href="#galaxy-spiral-path" class="arm-light" /><use href="#galaxy-spiral-path" class="arm-dust" /><use href="#galaxy-star-clusters" class="arm-stars" /></g>
              <g class="spiral-arm arm-4"><use href="#galaxy-spiral-path" class="arm-halo" /><use href="#galaxy-spiral-path" class="arm-light" /><use href="#galaxy-spiral-path" class="arm-dust" /><use href="#galaxy-star-clusters" class="arm-stars" /></g>
            </g>
            <circle class="galaxy-core-halo" cx="400" cy="400" r="145" />
            <ellipse class="galaxy-bulge" cx="400" cy="400" rx="72" ry="48" />
            <circle class="galaxy-core-light" cx="400" cy="400" r="62" />
            <circle class="galaxy-core-point" cx="400" cy="400" r="12" />
          </svg>
        </div>
      </section>
    </main>

    <footer class="footer">© 2026 Cosmic Phenomena</footer>
  </div>
  <script src="assets/js/main.js"></script>
</body>
</html>
